<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WebPOS · Liquid Glass · Bản thử</title><link rel="stylesheet" href="css/ui-theme.css">
<style>
:root{--preview-width:391px;--preview-height:780px}body{font-size:13px}.preview-header{max-width:900px;margin:auto;padding:14px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:16px}.preview-header h1{margin:0;font-size:18px;letter-spacing:-.5px}.preview-header p{margin:3px 0 0;color:var(--ui-muted);font-size:11px}.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:470px}.tools select{border-radius:999px;border:1px solid rgba(255,255,255,.9);color:var(--ui-primary);width:auto;min-height:32px;padding:5px 24px 5px 11px;font-size:11px;background:rgba(255,255,255,.36)}.screens{display:flex;align-items:flex-start;justify-content:center;gap:28px;padding:6px 20px 14px}.screen{width:var(--preview-width);flex-shrink:0}.caption{display:flex;align-items:center;justify-content:space-between;gap:8px;height:28px;font-size:11px}.caption strong{font-size:12px;font-weight:650}.caption a{color:var(--ui-primary);text-decoration:none}iframe{display:block;width:100%;height:var(--preview-height);border:1px solid rgba(255,255,255,.9);border-radius:32px;background:#f2e5eb;box-shadow:0 18px 50px rgba(95,34,64,.12),inset 0 1px white}footer{text-align:center;color:var(--ui-muted);font-size:10px;padding:0 12px 12px}@media(max-width:870px){.screens{flex-wrap:wrap}.preview-header{max-width:440px;align-items:flex-start;flex-direction:column;gap:10px}.tools{justify-content:flex-start}}@media(max-width:430px){.screens{padding-inline:10px}.screen{width:min(var(--preview-width),100%)}.preview-header{padding-inline:14px}}
</style></head><body><header class="preview-header"><div><h1>WebPOS · Liquid Glass</h1><p>Bản thử giao diện · Đỏ ruby / hồng sương</p></div><div class="tools"><select id="preview-pair" aria-label="Cặp màn hình"><option value="home">Menu quản lý &amp; Bán hàng</option><option value="manage">Sản phẩm &amp; Đơn hàng</option><option value="people">Nhân viên &amp; Giỏ hàng</option><option value="entry">Đăng nhập &amp; Menu nhân viên</option></select><select id="preview-width" aria-label="Độ rộng màn thử"><option value="391">391 px</option><option value="320">320 px</option><option value="430">430 px</option></select><select id="preview-height" aria-label="Chiều cao màn thử"><option value="780">780 px</option><option value="844">844 px</option><option value="568">568 px</option></select></div></header>
<main class="screens"><section class="screen"><div class="caption"><strong>01 · Menu quản lý</strong><a id="left-open" href="manager.html">Mở riêng ↗</a></div><iframe id="left-preview" title="Menu quản lý" src="manager.html"></iframe></section><section class="screen"><div class="caption"><strong>02 · Bán hàng</strong><a id="right-open" href="index.html">Mở riêng ↗</a></div><iframe id="right-preview" title="Bán hàng" src="index.html"></iframe></section></main><footer>Bấm thử trong từng khung · Dữ liệu, camera và thanh toán đều là minh họa.</footer>
<script>
for(const dimension of ['width','height'])document.getElementById('preview-'+dimension).addEventListener('change',function(){document.documentElement.style.setProperty('--preview-'+dimension,this.value+'px')});
const pairs={home:[['manager.html','01 · Menu quản lý'],['index.html','02 · Bán hàng']],manage:[['products.html','03 · Sản phẩm'],['orders.html','04 · Đơn hàng']],people:[['staff.html','05 · Nhân viên'],['cart.html','06 · Giỏ hàng']],entry:[['login.html','07 · Đăng nhập'],['menu.html','08 · Menu nhân viên']]};
document.getElementById('preview-pair').addEventListener('change',function(){['left','right'].forEach((side,index)=>{const [file,title]=pairs[this.value][index];const frame=document.getElementById(side+'-preview');frame.src=file;frame.title=title;document.getElementById(side+'-open').href=file;frame.parentElement.querySelector('.caption strong').textContent=title})});
</script></body></html>
