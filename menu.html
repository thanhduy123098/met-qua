<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Menu quản lý bán hàng." />
    <title>Menu | Bán hàng nhanh</title>
    <link rel="stylesheet" href="css/ui-theme.css" />
    <link rel="stylesheet" href="css/menu.css" />
  </head>
  <body>
    <main class="menu-page">
      <section class="menu-card" aria-labelledby="menu-title">
        <div class="menu-topbar">
          <span class="brand-mark" aria-hidden="true" data-ui-icon="store"></span>
          <button class="logout-button" id="logout-button" type="button">Đăng xuất</button>
        </div>

        <div class="welcome-block">
          <p class="menu-kicker">QUẢN LÝ CỬA HÀNG</p>
          <h1 id="menu-title">Chào <span id="account-name">BẠN</span>!</h1>
          <p>Chọn một chức năng để bắt đầu phiên làm việc.</p>
        </div>

        <nav class="menu-options" aria-label="Chức năng chính">
          <a class="menu-option sales-option" href="index.html">
            <span class="option-icon" aria-hidden="true" data-ui-icon="scan"></span>
            <span class="option-copy">
              <strong>Bán hàng</strong>
              <small>Tạo đơn và quản lý giỏ hàng</small>
            </span>
            <span class="option-arrow" aria-hidden="true" data-ui-icon="arrow"></span>
          </a>
          <a class="menu-option history-option" href="history.html">
            <span class="option-icon" aria-hidden="true" data-ui-icon="orders"></span>
            <span class="option-copy">
              <strong>Lịch sử đơn hàng</strong>
              <small>Xem lại các đơn đã hoàn tất</small>
            </span>
            <span class="option-arrow" aria-hidden="true" data-ui-icon="arrow"></span>
          </a>
          <a class="menu-option history-option" href="manager.html">
            <span class="option-icon" aria-hidden="true" data-ui-icon="store"></span>
            <span class="option-copy">
              <strong>Xem bản thử quản lý</strong>
              <small>Menu, sản phẩm, đơn hàng và nhân viên · Dữ liệu minh họa</small>
            </span>
            <span class="option-arrow" aria-hidden="true" data-ui-icon="arrow"></span>
          </a>
        </nav>

        <p class="menu-footer">BÁN HÀNG NHANH <span aria-hidden="true">•</span> PHIÊN LÀM VIỆC</p>
      </section>
    </main>
    <script src="js/ui-icons.js"></script>
<script src="js/menu.js"></script>
  </body>
</html>
